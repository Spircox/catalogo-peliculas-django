<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Mi Catálogo 🎬{% endblock %}</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('tema') || 'light');</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-bold" href="{% url 'catalogo:inicio' %}">🎬 Mi Catálogo</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{% url 'catalogo:inicio' %}">Inicio</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'catalogo:buscar' %}">Buscar</a></li>
      <li class="nav-item"><a class="nav-link" href="{% url 'catalogo:catalogo' %}">Mi catálogo</a></li>
    </ul>
    <button class="btn btn-sm btn-outline-light" id="btn-tema">🌙</button>
  </div>
</nav>
<main class="container">
  {% if messages %}{% for m in messages %}
  <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show">
    {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}{% endif %}
  {% block contenido %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const btn = document.getElementById('btn-tema');
  const pinta = () => btn.textContent = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? '☀️' : '🌙';
  pinta();
  btn.onclick = () => {
    const t = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', t);
    localStorage.setItem('tema', t);
    pinta();
  };
</script>
{% block extra_js %}{% endblock %}   <!-- ← ESTA LÍNEA FALTABA -->
</body>
</html>
